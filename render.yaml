services:
  - type: web
    name: safety-video-generator
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: PEXELS_API_KEY
        sync: false
        - key: HF_TOKEN
        sync: false   # free Hugging Face token, improves AI video generation quota
      - key: PYTHON_VERSION
        value: 3.11.0
